spring.application.name=agenda-tatuagem

# Porta diferente da do Rotina, para os dois aplicativos poderem rodar no mesmo computador.
server.port=8090

# Banco em arquivo na pasta do usuário: não precisa instalar nada.
spring.datasource.url=jdbc:h2:file:${user.home}/.agenda-tatuagem/agenda
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# As telas reduzem as fotos antes de enviar; o limite só barra arquivos fora do comum.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
